name: Firmware CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO 6.1.18
        run: python -m pip install platformio==6.1.18

      - name: Check repository safety
        run: python scripts/check_repo_safety.py

      - name: Run native tests
        run: pio test -e native

      - name: Build production firmware
        run: pio run -e esp32-c3

      - name: Create placeholder-only smoke compile configuration
        run: cp include/interbridge_dev_secrets.example.h include/interbridge_dev_secrets.h

      - name: Verify smoke configuration remains ignored
        run: |
          git check-ignore include/interbridge_dev_secrets.h
          test -z "$(git status --short --untracked-files=all)"

      - name: Compile DEV MQTT smoke firmware
        run: pio run -e esp32-c3-dev-mqtt
