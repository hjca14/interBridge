; PlatformIO project configuration for InterBridge Firmware.
;
; Two environments are defined:
;   - esp32-c3: the actual firmware target.
;   - native:   host-side unit tests for hardware-independent logic
;               (state machine, events, protocol interface, line detector
;               logic exercised through a mock IHardwareIO).
;
; See CONTEXT.md for the reasoning behind these choices and for open
; questions (exact dev board, GPIO mapping, Wi-Fi provisioning, etc).

[platformio]
default_envs = esp32-c3

; Target hardware: ESP32-C3. The exact development board/module has not
; been finalized yet (see CONTEXT.md > Open Questions), so
; esp32-c3-devkitm-1 is used as a generic, commonly available placeholder.
; Update this once the real hardware is selected.
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11

; Host-side unit tests. main.cpp and network/wifi.cpp are excluded because
; they depend on Arduino-only headers and cannot be compiled for a native
; host. Everything else in src/ (state machine, events, logger, hardware
; interface + stub, intercom, line detector, audio interface, protocol
; interface) is hardware-independent and is compiled and tested natively.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_src_filter =
    +<*>
    -<main.cpp>
    -<network/wifi.cpp>
test_framework = unity
test_build_src = true
