; PlatformIO project configuration for InterBridge Firmware.
;
; Two environments are defined:
;   - esp32-c3: the actual firmware target.
;   - native:   host-side unit tests for hardware-independent logic
;               (state machine, events, protocol interface, line detector
;               logic exercised through a mock IHardwareIO).
;
; See CONTEXT.md for the reasoning behind these choices and for open
; questions (exact dev board, GPIO mapping, Wi-Fi provisioning, etc).

[platformio]
default_envs = esp32-c3

; Bench hardware validated in Phase 1D: generic 4 MB ESP32-C3 Super Mini.
; esp32-c3-devkitm-1 is a temporary compatible board definition for that
; board; it does not select the module for the eventual custom PCB.
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++11
build_src_filter =
    +<*>
    -<dev/mqtt_smoke_main.cpp>

; Controlled, manually provisioned DEV-only AWS IoT smoke firmware. This
; bypasses unfinished production onboarding solely for bench validation.
[env:esp32-c3-dev-mqtt]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    256dpi/MQTT@^2.5.2
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DINTERBRIDGE_DEV_MQTT_SMOKE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++11
build_src_filter =
    +<*>
    -<main.cpp>

; Host-side unit tests. main.cpp and network/wifi.cpp are excluded because
; they depend on Arduino-only headers and cannot be compiled for a native
; host. Everything else in src/ (state machine, events, logger, hardware
; interface + stub, intercom, line detector, audio interface, protocol
; interface) is hardware-independent and is compiled and tested natively.
[env:native]
platform = native
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_src_filter =
    +<*>
    -<main.cpp>
    -<dev/mqtt_smoke_main.cpp>
    -<network/wifi.cpp>
test_framework = unity
test_build_src = true
