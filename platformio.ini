; PlatformIO project configuration for InterBridge Firmware.
;
; Two environments are defined:
;   - esp32-c3: the actual firmware target.
;   - native:   host-side unit tests for hardware-independent logic
;               (state machine, events, protocol interface, line detector
;               logic exercised through a mock IHardwareIO).
;
; See CONTEXT.md for the reasoning behind these choices and for open
; questions (exact dev board, GPIO mapping, Wi-Fi provisioning, etc).

[platformio]
default_envs = esp32-c3

; Bench hardware validated in Phase 1D: generic 4 MB ESP32-C3 Super Mini.
; esp32-c3-devkitm-1 is a temporary compatible board definition for that
; board; it does not select the module for the eventual custom PCB.
[env:esp32-c3]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    256dpi/MQTT@^2.5.2
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++11
build_src_filter =
    +<*>
    -<dev/mqtt_smoke_main.cpp>
    -<dev/dev_ring_simulator_main.cpp>
    -<dev/ble_provisioning_main.cpp>
    -<dev/si3050_clock_probe_generator_main.cpp>
    -<dev/si3050_clock_probe_meter_main.cpp>

; Controlled, manually provisioned DEV-only AWS IoT smoke firmware. This
; bypasses unfinished production onboarding solely for bench validation.
[env:esp32-c3-dev-mqtt]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    256dpi/MQTT@^2.5.2
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DINTERBRIDGE_DEV_MQTT_SMOKE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++11
build_src_filter =
    +<*>
    -<main.cpp>
    -<dev/dev_ring_simulator_main.cpp>
    -<dev/ble_provisioning_main.cpp>
    -<dev/si3050_clock_probe_generator_main.cpp>
    -<dev/si3050_clock_probe_meter_main.cpp>

; Phase 3B.8 bench-only DEV physical ring simulator: a momentary button
; (see src/dev/dev_ring_simulator_config.h for the GPIO and
; docs/dev-ring-simulator.md for the full wiring/runbook) publishes a real
; RING_DETECTED DeviceEvent through the exact same AWS IoT Basic Ingest
; flow as production (topics/serialization/outbox), reusing the DEV MQTT
; smoke environment's connectivity bring-up (DevMqttSmokeState) rather
; than duplicating it. It also subscribes to and processes commands through
; the exact same RemoteCommandProcessor/CommandHandler composition
; esp32-c3-dev-mqtt uses (cumulative DEV integration pass - see
; docs/dev-ring-simulator.md > "Command processing"), never a second
; implementation. It never touches the real Si3050, RingDetector, PCM
; clock, provisioning, BLE, or production Wi-Fi/AWS composition - see
; docs/dev-ring-simulator.md > Scope and safety.
[env:esp32-c3-dev-ring-simulator]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    256dpi/MQTT@^2.5.2
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DINTERBRIDGE_DEV_RING_SIMULATOR
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++11
build_src_filter =
    +<*>
    -<main.cpp>
    -<dev/mqtt_smoke_main.cpp>
    -<dev/ble_provisioning_main.cpp>
    -<dev/si3050_clock_probe_generator_main.cpp>
    -<dev/si3050_clock_probe_meter_main.cpp>

; Phase 3C.1 isolated BLE onboarding validation. Arduino-ESP32's official
; WiFiProv wrapper delegates to ESP-IDF Wi-Fi Provisioning Manager +
; Protocomm; this target deliberately excludes the production composition
; and every call/Si3050 simulator. The local PoP header is gitignored.
[env:esp32-c3-dev-ble-provisioning]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
; Official Arduino-ESP32 4 MB, no-OTA layout. This is scoped only to the
; isolated BLE experiment; production and every existing DEV target retain
; their default partition tables.
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DINTERBRIDGE_DEV_BLE_PROVISIONING
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++11
build_src_filter =
    -<*>
    +<provisioning/ble_provisioning.cpp>
    +<dev/ble_provisioning_main.cpp>

; Phase 3B.1 bench-only experiment: an isolated ESP32-C3 firmware that
; generates the Si3050's target PCLK/FSYNC clocks in hardware (I2S TDM,
; see src/dev/si3050_clock_probe_generator_main.cpp), to be measured by a
; second board (esp32dev-si3050-clock-meter below). This is NOT the
; Si3050Controller/production PCM clock - Esp32PcmClock remains an
; untouched stub. -<*> then +<specific files> keeps this environment from
; ever compiling main.cpp, the DEV MQTT smoke harness, provisioning, or
; any other firmware path alongside it.
[env:esp32-c3-si3050-clock-probe]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DINTERBRIDGE_SI3050_CLOCK_PROBE_GENERATOR
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_unflags =
    -std=gnu++11
build_src_filter =
    -<*>
    +<dev/si3050_clock_probe_generator_main.cpp>

; Phase 3B.1 bench-only experiment: an isolated classic ESP32 (DevKitV1)
; firmware that measures the clocks generated by
; esp32-c3-si3050-clock-probe above, via hardware pulse counting (PCNT) -
; see src/dev/si3050_clock_probe_meter_main.cpp and
; src/dev/si3050_clock_probe_math.{h,cpp}. Same isolation rationale as the
; generator environment above; also does not depend on Wi-Fi.
[env:esp32dev-si3050-clock-meter]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DINTERBRIDGE_SI3050_CLOCK_PROBE_METER
build_unflags =
    -std=gnu++11
build_src_filter =
    -<*>
    +<dev/si3050_clock_probe_meter_main.cpp>
    +<dev/si3050_clock_probe_math.cpp>
    +<dev/si3050_clock_probe_meter_bringup.cpp>

; Host-side unit tests. main.cpp and network/wifi.cpp are excluded because
; they depend on Arduino-only headers and cannot be compiled for a native
; host. Everything else in src/ (state machine, events, logger, hardware
; interface + stub, intercom, line detector, audio interface, protocol
; interface) is hardware-independent and is compiled and tested natively.
[env:native]
platform = native
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DUNITY_INCLUDE_DOUBLE
build_src_filter =
    +<*>
    -<main.cpp>
    -<dev/mqtt_smoke_main.cpp>
    -<dev/dev_ring_simulator_main.cpp>
    -<dev/ble_provisioning_main.cpp>
    -<dev/dev_command_diagnostics.cpp>
    -<network/wifi.cpp>
    -<dev/si3050_clock_probe_generator_main.cpp>
    -<dev/si3050_clock_probe_meter_main.cpp>
test_framework = unity
test_build_src = true
